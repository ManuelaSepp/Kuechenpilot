<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Küchenpilot - Wer isst mit?</title>
    <style>
        @font-face {
            font-family: "Architects Daughter";
            src: url("fonts/ArchitectsDaughter-Regular.ttf") format("truetype");
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --sand: #fff7ea;
            --card: #fffdf8;
            --orange: #f5a623;
            --orange-dark: #df8f12;
            --text: #333333;
            --muted: #555555;
            --shadow: 0 16px 36px rgba(166, 112, 34, 0.16);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px;
            font-family: "Architects Daughter", sans-serif;
            background: var(--sand);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
        }

        .start-page {
            width: min(100%, 940px);
            position: relative;
            padding: 48px 110px 48px 0;
        }

        .welcome-card {
            position: relative;
            z-index: 3;
            width: min(100%, 720px);
            background: var(--card);
            border: 2px solid rgba(245, 166, 35, 0.42);
            border-radius: 30px;
            padding: 42px 46px;
            box-shadow: var(--shadow);
        }

        .pilot-card {
            position: absolute;
            z-index: 2;
            right: 105px;
            top: 50%;
            width: 190px;
            max-width: 32vw;
            transform: translateY(-50%);
            pointer-events: none;
            background: var(--card);
            border: 2px solid rgba(245, 166, 35, 0.42);
            border-radius: 28px;
            box-shadow: var(--shadow);
            padding: 6px;
            overflow: hidden;
        }

        .pilot-card img {
            width: 100%;
            height: auto;
            display: block;
        }

        .pilot-mobile {
            display: none;
        }

        h1 {
            margin: 0 0 22px;
            font-size: clamp(2.1rem, 5vw, 3.5rem);
            line-height: 1.08;
            font-weight: 600;
        }

        h1 span {
            color: var(--orange);
        }

        p {
            margin: 0;
            max-width: 560px;
            color: var(--muted);
            font-size: clamp(1.22rem, 2.4vw, 1.55rem);
            line-height: 1.55;
        }

        .button-row {
            margin-top: 34px;
            display: flex;
            justify-content: flex-end;
        }

        .next-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            min-width: 220px;
            min-height: 64px;
            padding: 12px 24px;
            border: 2px solid var(--orange);
            border-radius: 20px;
            background: #ffffff;
            color: var(--orange-dark);
            font-family: inherit;
            font-size: 1.35rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 10px 22px rgba(166, 112, 34, 0.12);
            transition: transform 0.18s ease, box-shadow 0.18s ease, background-color 0.18s ease, color 0.18s ease;
        }

        .next-button:hover,
        .next-button:focus-visible {
            background: var(--orange);
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 14px 28px rgba(166, 112, 34, 0.20);
            outline: none;
        }

        .next-button img {
            width: 34px;
            height: 34px;
            object-fit: contain;
            transition: filter 0.18s ease;
        }

        .next-button:hover img,
        .next-button:focus-visible img {
            filter: brightness(0) invert(1);
        }

        .arrow {
            font-size: 1.45rem;
            line-height: 1;
            transform: translateY(-1px);
        }

        @media (max-width: 760px) {
            body {
                padding: 18px;
                align-items: flex-start;
            }

            .start-page {
                width: 100%;
                padding: 138px 0 0;
                margin-top: 14px;
            }

            .pilot-desktop {
                display: none;
            }

            .pilot-mobile {
                display: block;
            }

            .pilot-card {
                left: 50%;
                right: auto;
                top: 28px;
                width: 225px;
                max-width: 68vw;
                transform: translateX(-50%);
                z-index: 2;
                border-radius: 28px;
                padding: 10px;
            }

            .welcome-card {
                width: 100%;
                z-index: 3;
                padding: 40px 24px 26px;
                border-radius: 26px;
            }

            h1 {
                margin-bottom: 18px;
            }

            .button-row {
                margin-top: 28px;
                justify-content: center;
            }

            .next-button {
                width: 100%;
                max-width: 340px;
                min-height: 62px;
                font-size: 1.28rem;
            }
        }

        @media (max-width: 420px) {
            .start-page {
                padding-top: 128px;
            }

            .pilot-card {
                width: 188px;
                top: 30px;
            }

            .welcome-card {
                padding: 40px 20px 24px;
            }
        }

        .person-row {
            margin-top: 24px;
            display: flex;
            align-items: center;
            gap: 34px;
            flex-wrap: wrap;
        }

        .person-counter {
            display: inline-flex;
            align-items: center;
            gap: 16px;
        }

        .count-button {
            width: 42px;
            height: 42px;
            border: 2px solid var(--orange);
            border-radius: 14px;
            background: #ffffff;
            color: var(--orange-dark);
            font-family: inherit;
            font-size: 1.5rem;
            line-height: 1;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(166, 112, 34, 0.10);
        }

        .count-button:hover,
        .count-button:focus-visible {
            background: var(--orange);
            color: #ffffff;
            outline: none;
        }

        .count-value {
            min-width: 46px;
            text-align: center;
            font-size: 2.25rem;
            color: var(--orange-dark);
        }

        .optional-persons {
            margin: 0;
        }

        .optional-persons summary {
            cursor: pointer;
            color: var(--orange-dark);
            font-size: 1.34rem;
            font-weight: 600;
            line-height: 1.25;
        }

        .person-list {
            margin-top: 16px;
            display: grid;
            gap: 14px;
            width: 100%;
        }

        .person-card {
            background: #ffffff;
            border: 2px solid rgba(245, 166, 35, 0.30);
            border-radius: 20px;
            padding: 14px;
        }

        .person-card h2 {
            margin: 0 0 8px;
            font-size: 1.24rem;
        }

        .person-card label {
            display: block;
            margin-top: 7px;
            font-size: 0.96rem;
            color: var(--muted);
        }

        .person-card input,
        .person-card textarea {
            width: 100%;
            margin-top: 5px;
            padding: 8px 10px;
            border: 2px solid rgba(245, 166, 35, 0.25);
            border-radius: 14px;
            background: #fffdf8;
            color: var(--text);
            font-family: inherit;
            font-size: 1rem;
        }

        .person-card textarea {
            min-height: 46px;
            resize: vertical;
        }

        .button-row.double {
            justify-content: space-between;
            gap: 18px;
        }

        .button-row.double .next-button {
            min-width: 190px;
        }

        @media (max-width: 760px) {
            .person-row {
                margin-top: 28px;
                flex-direction: column;
                align-items: stretch;
                gap: 18px;
            }

            .person-counter {
                justify-content: center;
            }

            .button-row.double {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 12px;
                justify-content: stretch;
            }

            .button-row.double .next-button {
                width: 100%;
                min-width: 0;
                max-width: none;
                padding: 10px 12px;
                font-size: 1.12rem;
                gap: 8px;
            }
        }


        .optional-toggle {
            border: 0;
            background: transparent;
            padding: 0;
            color: var(--orange-dark);
            font-family: inherit;
            font-size: 1.26rem;
            font-weight: 600;
            line-height: 1.25;
            cursor: pointer;
        }

        .person-cards-area {
            position: relative;
            z-index: 3;
            width: min(100%, clamp(720px, 64vw, 790px));
            display: grid;
            gap: 24px;
            margin-top: 28px;
        }

        .person-big-card {
            background: var(--card);
            border: 2px solid rgba(245, 166, 35, 0.42);
            border-radius: 30px;
            padding: clamp(34px, 3.4vw, 42px) clamp(46px, 4.5vw, 56px);
            box-shadow: var(--shadow);
        }

        .person-big-card h2 {
            margin: 0 0 18px;
            font-size: clamp(1.7rem, 3vw, 2.2rem);
            color: var(--orange-dark);
        }

        .person-big-card label {
            display: block;
            margin-top: 14px;
            color: var(--muted);
            font-size: 1.05rem;
        }

        .person-big-card input,
        .person-big-card textarea {
            width: 100%;
            margin-top: 6px;
            padding: 11px 13px;
            border: 2px solid rgba(245, 166, 35, 0.25);
            border-radius: 15px;
            background: #fffdf8;
            color: var(--text);
            font-family: inherit;
            font-size: 1.02rem;
        }

        .person-big-card textarea {
            min-height: 62px;
            resize: vertical;
        }

        @media (max-width: 760px) {
            .optional-toggle {
                text-align: left;
                font-size: 1.18rem;
            }

            .person-cards-area {
                width: 100%;
                gap: 18px;
                margin-top: 22px;
            }

            .person-big-card {
                padding: 28px 24px;
                border-radius: 26px;
            }
        }

    </style>
</head>
<body>

    <main class="start-page" aria-label="Küchenpilot Personenseite">
        <div class="pilot-card pilot-desktop">
            <img src="assets/figuren/pilot-mauer-schraeg.png" alt="Küchenpilot">
        </div>

        <div class="pilot-card pilot-mobile">
            <img src="assets/figuren/pilot-megafreu.png" alt="Küchenpilot">
        </div>

        <section class="welcome-card">
            <h1>Wer <span>isst mit?</span></h1>
            <p>Für wie viele Personen soll ich planen?<br>Optionales kannst du später ergänzen.</p>

            <div class="person-row">
                <div class="person-counter" aria-label="Personenanzahl auswählen">
                    <button class="count-button" type="button" onclick="changePersons(-1)" aria-label="Eine Person weniger">−</button>
                    <div class="count-value" id="personCount">2</div>
                    <button class="count-button" type="button" onclick="changePersons(1)" aria-label="Eine Person mehr">+</button>
                </div>

                <button class="optional-toggle" type="button" onclick="togglePersonCards()">
                    Optionale Angaben ergänzen
                </button>
            </div>

            <div class="button-row double">
                <button class="next-button" type="button" onclick="location.href='index.html'" aria-label="Zurück zur Startseite">
                    <span class="arrow" aria-hidden="true">←</span>
                    <span>Zurück</span>
                </button>

                <button class="next-button" type="button" onclick="location.href='heute.html'" aria-label="Weiter zur Heute-Seite">
                    <span>Weiter</span>
                    <span class="arrow" aria-hidden="true">→</span>
                </button>
            </div>
        </section>

        <section class="person-cards-area" id="personCards" hidden></section>
    </main>

    <script>
        let personCount = 2;
        let personCardsVisible = false;

        function changePersons(amount) {
            personCount = Math.max(1, personCount + amount);
            document.getElementById("personCount").textContent = personCount;
            renderPersons();
        }

        function togglePersonCards() {
            personCardsVisible = !personCardsVisible;
            renderPersons();
        }

        function renderPersons() {
            const area = document.getElementById("personCards");
            area.innerHTML = "";

            if (!personCardsVisible) {
                area.hidden = true;
                return;
            }

            area.hidden = false;

            for (let i = 1; i <= personCount; i++) {
                const card = document.createElement("section");
                card.className = "person-big-card";
                card.innerHTML = `
                    <h2>Person ${i}</h2>

                    <label>Name
                        <input type="text" placeholder="z. B. Manuela">
                    </label>

                    <label>Vorlieben
                        <textarea placeholder="z. B. Kartoffeln, Reis, Fisch"></textarea>
                    </label>

                    <label>Mag ich nicht
                        <textarea placeholder="z. B. Paprika, Linsen"></textarea>
                    </label>

                    <label>Allergien / Unverträglichkeiten
                        <textarea placeholder="z. B. Laktose, Nüsse"></textarea>
                    </label>
                `;
                area.appendChild(card);
            }
        }

        renderPersons();
    </script>

</body>
</html>
