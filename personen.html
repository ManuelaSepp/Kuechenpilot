<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Küchenpilot - Personen</title>
    <style>
        @font-face {
            font-family: "Architects Daughter";
            src: url("fonts/ArchitectsDaughter-Regular.ttf") format("truetype");
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --sand: #fff7ea;
            --card: #fffdf8;
            --orange: #f5a623;
            --orange-dark: #df8f12;
            --text: #333333;
            --muted: #555555;
            --shadow: 0 16px 36px rgba(166, 112, 34, 0.16);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px;
            font-family: "Architects Daughter", sans-serif;
            background: var(--sand);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
        }

        .start-page {
            width: min(100%, clamp(940px, 78vw, 1040px));
            position: relative;
            padding: clamp(48px, 5vw, 58px) clamp(110px, 10vw, 132px) clamp(48px, 5vw, 58px) 0;
        }

        .welcome-card {
            position: relative;
            z-index: 3;
            width: min(100%, clamp(720px, 64vw, 790px));
            background: var(--card);
            border: 2px solid rgba(245, 166, 35, 0.42);
            border-radius: 30px;
            padding: clamp(42px, 4vw, 50px) clamp(46px, 4.5vw, 56px);
            box-shadow: var(--shadow);
        }

        .pilot-card {
            position: absolute;
            z-index: 2;
            right: clamp(105px, 9vw, 126px);
            top: 50%;
            width: clamp(190px, 17vw, 215px);
            max-width: 32vw;
            transform: translateY(-50%);
            pointer-events: none;
            background: var(--card);
            border: 2px solid rgba(245, 166, 35, 0.42);
            border-radius: 28px;
            box-shadow: var(--shadow);
            padding: 6px;
            overflow: hidden;
        }

        .pilot-card img {
            width: 100%;
            height: auto;
            display: block;
        }

        .pilot-mobile {
            display: none;
        }

        h1 {
            margin: 0 0 22px;
            text-align: center;
            font-size: clamp(2.1rem, 5vw, 3.5rem);
            line-height: 1.08;
            font-weight: 600;
        }

        h1 span {
            color: var(--orange);
        }

        p {
            margin: 0 auto;
            max-width: 560px;
            text-align: center;
            color: var(--muted);
            font-size: clamp(1.22rem, 2.4vw, 1.55rem);
            line-height: 1.42;
        }

        .button-row {
            margin-top: 22px;
            display: flex;
            justify-content: flex-end;
        }

        .next-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            min-width: 220px;
            min-height: 64px;
            padding: 12px 24px;
            border: 2px solid var(--orange);
            border-radius: 20px;
            background: #ffffff;
            color: var(--orange-dark);
            font-family: inherit;
            font-size: 1.35rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 10px 22px rgba(166, 112, 34, 0.12);
            transition: transform 0.18s ease, box-shadow 0.18s ease, background-color 0.18s ease, color 0.18s ease;
        }

        .next-button:hover,
        .next-button:focus-visible {
            background: var(--orange);
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 14px 28px rgba(166, 112, 34, 0.20);
            outline: none;
        }

        .next-button img {
            width: 34px;
            height: 34px;
            object-fit: contain;
            transition: filter 0.18s ease;
        }

        .next-button:hover img,
        .next-button:focus-visible img {
            filter: brightness(0) invert(1);
        }

        .arrow {
            font-size: 1.45rem;
            line-height: 1;
            transform: translateY(-1px);
        }

        @media (min-width: 761px) {
            html body.persons-page .start-page {
                margin-top: max(0px, calc((100vh - 500px) / 2 - clamp(20px, 2.5vw, 32px) - clamp(32px, 5vw, 58px)));
                transform: translateY(clamp(-32px, -4vh, -20px));
            }

            body.persons-page .welcome-card {
                width: min(100%, 790px);
                height: 500px;
                display: flex;
                flex-direction: column;
            }

            body.persons-page .card-main {
                width: 100%;
                flex: 1;
                display: flex;
                flex-direction: column;
                justify-content: flex-start;
                padding-top: 34px;
            }

            body.persons-page .button-row.double {
                margin-top: auto;
            }
        }

        @media (min-width: 761px) and (max-width: 1050px) {
            html body.persons-page .start-page {
                margin-top: max(0px, calc((100vh - 500px) / 2 - clamp(20px, 2.5vw, 32px) - clamp(24px, 4vw, 42px)));
            }
        }

        @media (max-width: 760px) {
            body {
                padding: 18px;
                align-items: flex-start;
            }

            .start-page {
                width: 100%;
                padding: 138px 0 0;
                margin-top: 14px;
            }

            .pilot-desktop {
                display: none;
            }

            .pilot-mobile {
                display: block;
            }

            .pilot-card {
                left: 50%;
                right: auto;
                top: 28px;
                width: 225px;
                max-width: 68vw;
                transform: translateX(-50%);
                z-index: 2;
                border-radius: 28px;
                padding: 10px;
            }

            .welcome-card {
                width: 100%;
                z-index: 3;
                padding: 40px 24px 26px;
                border-radius: 26px;
            }

            h1 {
                margin-bottom: 18px;
            }

            .button-row {
                margin-top: 28px;
                justify-content: center;
            }

            .next-button {
                width: 100%;
                max-width: 340px;
                min-height: 62px;
                font-size: 1.28rem;
            }
        }

        @media (max-width: 420px) {
            .start-page {
                padding-top: 128px;
            }

            .pilot-card {
                width: 188px;
                top: 30px;
            }

            .welcome-card {
                padding: 40px 20px 24px;
            }
        }

        .person-row {
            margin-top: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            flex-wrap: wrap;
            text-align: center;
        }

        .person-counter {
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }

        .count-button {
            width: 42px;
            height: 42px;
            border: 2px solid var(--orange);
            border-radius: 14px;
            background: #ffffff;
            color: var(--orange-dark);
            font-family: inherit;
            font-size: 1.5rem;
            line-height: 1;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(166, 112, 34, 0.10);
        }

        .count-button:hover,
        .count-button:focus-visible {
            background: var(--orange);
            color: #ffffff;
            outline: none;
        }

        .count-value {
            min-width: 46px;
            text-align: center;
            font-size: 2.25rem;
            color: var(--orange-dark);
        }

        .optional-persons {
            margin: 0;
        }

        .optional-persons summary {
            cursor: pointer;
            color: var(--orange-dark);
            font-size: 1.26rem;
            font-weight: 600;
            line-height: 1.25;
        }

        .person-list {
            margin-top: 16px;
            display: grid;
            gap: 14px;
            width: 100%;
        }

        .person-card {
            background: #ffffff;
            border: 2px solid rgba(245, 166, 35, 0.30);
            border-radius: 20px;
            padding: 14px;
        }

        .person-card h2 {
            margin: 0 0 8px;
            font-size: 1.24rem;
        }

        .person-card label {
            display: block;
            margin-top: 7px;
            font-size: 0.96rem;
            color: var(--muted);
        }

        .person-card input,
        .person-card textarea {
            width: 100%;
            margin-top: 5px;
            padding: 8px 10px;
            border: 2px solid rgba(245, 166, 35, 0.25);
            border-radius: 14px;
            background: #fffdf8;
            color: var(--text);
            font-family: inherit;
            font-size: 1rem;
        }

        .person-card textarea {
            min-height: 46px;
            resize: vertical;
        }

        .button-row.double {
            justify-content: space-between;
            gap: 18px;
        }

        .button-row.double .next-button {
            min-width: 170px;
            min-height: 56px;
            padding: 10px 20px;
            font-size: 1.18rem;
            gap: 10px;
        }

        @media (max-width: 760px) {
            .person-row {
                margin-top: 28px;
                flex-direction: column;
                align-items: stretch;
                gap: 18px;
            }

            .person-counter {
                justify-content: center;
            }

            .button-row.double {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 12px;
                justify-content: stretch;
            }

            .button-row.double .next-button {
                width: 100%;
                min-width: 0;
                max-width: none;
                padding: 10px 12px;
                font-size: 1.12rem;
                gap: 8px;
            }
        }

    
.optional-toggle{
    border:0;
    background:none;
    color:var(--orange-dark);
    font:inherit;
    font-size:1.26rem;
    font-weight:600;
    cursor:pointer;
    padding:0;
}

/* Handy und Tablet: Personen-Felder als Fenster über der Seite. */
.person-cards.as-popup{
    position:fixed;
    inset:0;
    z-index:1001;
    width:100%;
    margin:0;
    padding:72px 16px 28px;
    overflow-y:auto;
    background:rgba(51,36,10,.38);
    display:grid;
    align-content:start;
    justify-items:center;
}

.person-cards.as-popup .person-sheet{
    width:min(100%, 620px);
}

.popup-close{
    position:fixed;
    top:14px;
    left:14px;
    z-index:1002;
    min-height:48px;
    padding:8px 18px;
    border:2px solid #f5a623;
    border-radius:16px;
    background:#ffffff;
    color:#df8f12;
    font:inherit;
    font-size:1.05rem;
    cursor:pointer;
}

.popup-close:hover,.popup-close:focus-visible{
    background:#f5a623;
    color:#ffffff;
    outline:none;
}

.person-cards{
    width:min(100%, clamp(720px,64vw,790px));
    margin-top:28px;
    display:grid;
    gap:24px;
}

.person-sheet{
    background:var(--card);
    border:2px solid rgba(245,166,35,.42);
    border-radius:30px;
    padding:clamp(42px,4vw,50px) clamp(46px,4.5vw,56px);
    box-shadow:var(--shadow);
}


/* Deine Küche: Airfryer-Größe für den ganzen Haushalt. */
.kitchen-sheet{
    background:var(--card);
    border:2px solid rgba(245,166,35,.42);
    border-radius:30px;
    padding:clamp(28px,4vw,42px) clamp(24px,4.5vw,56px);
    box-shadow:var(--shadow);
}
.person-cards.as-popup .kitchen-sheet{width:min(100%, 620px);}
.kitchen-sheet h2{margin:0 0 14px;color:var(--orange-dark);}
.airfryer-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:16px;}
.airfryer-row[hidden]{display:none;}
.airfryer-row .count-value{font-size:1.8rem;min-width:36px;}
.no-airfryer{display:inline-flex;}
.kitchen-hint{margin:14px 0 0;text-align:left;color:var(--muted);font-size:.95rem;}
.person-sheet h2{margin:0 0 18px;color:var(--orange-dark);}
.person-sheet label{display:block;margin-top:12px;}
.person-sheet input:not([type="checkbox"]),
.person-sheet textarea,
.person-sheet select{
 width:100%;
 margin-top:6px;
 padding:10px 12px;
 border:2px solid rgba(245,166,35,.25);
 border-radius:14px;
 font:inherit;
 background:#fff;
 color:var(--text);
}
.person-sheet textarea{min-height:58px;}

.person-options-grid{
 margin-top:22px;
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:16px 18px;
}

.person-options-grid label{margin-top:0;}
.shake-details{grid-column:1/-1;}
.shake-details[hidden]{display:none;}

.allergy-fieldset{
 margin:22px 0 0;
 padding:0;
 border:0;
}

.allergy-fieldset legend{
 margin-bottom:10px;
 color:var(--text);
 font-size:1rem;
}

.allergy-options{
 display:flex;
 flex-wrap:wrap;
 gap:8px;
}

.allergy-chip{
 display:inline-flex!important;
 align-items:center;
 gap:8px;
 margin:0!important;
 padding:8px 11px;
 border:2px solid rgba(245,166,35,.25);
 border-radius:999px;
 background:#fff;
 cursor:pointer;
}

.allergy-chip input{
 width:18px;
 height:18px;
 margin:0;
 accent-color:var(--orange);
}

.allergy-chip:has(input:checked){
 border-color:rgba(245,166,35,.65);
 background:#fff7e6;
}

.allergy-details{margin-top:14px!important;}
.allergy-details summary{cursor:pointer;font-family:'Architects Daughter',cursive;font-size:1.1rem;padding:4px 0;}
.allergy-details textarea{width:100%;margin-top:8px;}
.own-rows{margin-top:12px;display:grid;gap:8px;}
.own-row{display:grid;gap:4px;font-size:.95rem;}
.own-row[hidden]{display:none;}
.own-row input{width:100%;box-sizing:border-box;padding:8px;border-radius:8px;border:1px solid #d8c7a8;}

@media (max-width:760px){
 .person-options-grid{grid-template-columns:1fr;}
 .shake-details{grid-column:auto;}
}

</style>

</head>
<body class="persons-page">

    <main class="start-page" aria-label="Küchenpilot Personenseite">
        <div class="hero-shell">
        <div class="pilot-card pilot-desktop">
            <img src="assets/figuren/pilot-tisch.png" alt="Koch und Köchin am Tisch">
        </div>

        <div class="pilot-card pilot-mobile">
            <img src="assets/figuren/pilot-tisch.png" alt="Koch und Köchin am Tisch">
        </div>

        <section class="welcome-card">
            <div class="card-main">
                <h1>Wer <span>isst mit?</span></h1>
                <p>Für wie viele Personen soll ich planen?<br>Personen und Vorlieben eintragen (optional).</p>

                <div class="person-row">
                    <div class="person-counter" aria-label="Personenanzahl auswählen">
                        <button class="count-button" type="button" onclick="changePersons(-1)" aria-label="Eine Person weniger">−</button>
                        <div class="count-value" id="personCount">2</div>
                        <button class="count-button" type="button" onclick="changePersons(1)" aria-label="Eine Person mehr">+</button>
                    </div>

                    <button class="optional-toggle" type="button" onclick="togglePersons()">
                        Optionale Angaben ergänzen
                    </button>
                </div>
            </div>

            <div class="button-row double">
                <button class="next-button" type="button" onclick="location.href='index.html'" aria-label="Zurück zur Startseite">
                    <span class="arrow" aria-hidden="true">←</span>
                    <span>Zurück</span>
                </button>

                <button class="next-button" type="button" onclick="location.href='grundvorrat.html'" aria-label="Weiter zum Grundvorrat">
                    <span>Weiter</span>
                    <span class="arrow" aria-hidden="true">→</span>
                </button>
            </div>
        </section>
        </div>

        <section id="personCards" class="person-cards" hidden></section>
    </main>

    
<script src="assets/scripts/airfryer.js?v=1"></script>
<script>
let personCount=(()=>{try{const n=Number(JSON.parse(localStorage.getItem('kuechenpilotPersonen')||'2'));return n>=1?Math.round(n):2;}catch(e){return 2;}})();
document.getElementById('personCount').textContent=personCount;
let openPersons=false;

function changePersons(a){
 personCount=Math.max(1,personCount+a);
 document.getElementById('personCount').textContent=personCount;
 try{localStorage.setItem('kuechenpilotPersonen',JSON.stringify(personCount));}catch(e){}
 renderPersonCards();
}

function togglePersons(){
 openPersons=!openPersons;
 renderPersonCards();
}

function toggleShakeDetails(select){
 const details=select.closest('.person-options-grid')?.querySelector('.shake-details');
 if(details) details.hidden=select.value==='none';
}

const DETAILS_KEY='kuechenpilotPersonenDetails';

/* Häufige Allergien als Häkchen: [gespeicherter Wert, Anzeige]. */
const ALLERGIEN=[
 ['Gluten','Gluten'],
 ['Milch/Laktose','Milch/Laktose'],
 ['Ei','Ei'],
 ['Erdnüsse','Erdnüsse'],
 ['Schalenfrüchte','Schalenfrüchte (Mandel, Haselnuss, Walnuss, Cashew, Pistazie)'],
 ['Soja','Soja'],
 ['Fisch/Meeresfrüchte','Fisch/Meeresfrüchte'],
 ['Sellerie','Sellerie'],
 ['Senf','Senf'],
 ['Sesam','Sesam'],
 ['Paprika','Paprika']
];

/* Alte Einträge „Erdnüsse/Nüsse“ werden beim Eintragen auf die getrennten Punkte umgestellt. */
function allergienUmstellen(liste){
 const out=[];
 (liste||[]).forEach(a=>{ if(a==='Erdnüsse/Nüsse') out.push('Erdnüsse','Schalenfrüchte'); else out.push(a); });
 return [...new Set(out)];
}

/* Eigene Ersatz-Zeilen nur für angekreuzte Allergien zeigen. */
function zeileAnzeigen(sheet){
 sheet.querySelectorAll('.own-row').forEach(row=>{
   const cb=[...sheet.querySelectorAll('input[type=checkbox]')].find(el=>el.value===row.dataset.for);
   row.hidden=!(cb&&cb.checked);
 });
}

function ladeDetails(){
 try{ const v=JSON.parse(localStorage.getItem(DETAILS_KEY)||'[]'); return Array.isArray(v)?v:[]; }catch(e){ return []; }
}

function sichereDetails(){
 const liste=[...document.querySelectorAll('#personCards .person-sheet')].map(sheet=>{
   const eigene={};
   sheet.querySelectorAll('[data-ersatz]').forEach(el=>{ const v=el.value.trim(); if(v) eigene[el.dataset.ersatz]=v; });
   return {
     name:(sheet.querySelector('.person-name')?.value||'').trim(),
     texte:[...sheet.querySelectorAll('input[type=text]:not([data-ersatz]), textarea:not([data-weitere])')].map(el=>el.value),
     auswahl:[...sheet.querySelectorAll('select')].map(el=>el.value),
     ernaehrung:sheet.querySelectorAll('select')[1]?.value||'',
     allergien:[...sheet.querySelectorAll('input[type=checkbox]:checked')].map(el=>el.value),
     eigeneErsaetze:eigene,
     weitere:sheet.querySelector('[data-weitere]')?.value||''
   };
 });
 try{ localStorage.setItem(DETAILS_KEY,JSON.stringify(liste)); }catch(e){}
}

function angabenEintragen(sheet, daten){
 sheet.querySelectorAll('input[type=text]:not([data-ersatz]), textarea:not([data-weitere])').forEach((el,i)=>{ if(daten.texte && daten.texte[i]!=null) el.value=daten.texte[i]; });
 const nameFeld=sheet.querySelector('.person-name');
 if(nameFeld && daten.name) nameFeld.value=daten.name;
 sheet.querySelectorAll('select').forEach((el,i)=>{ if(daten.auswahl && daten.auswahl[i]!=null) el.value=daten.auswahl[i]; });
 const alle=allergienUmstellen(daten.allergien);
 sheet.querySelectorAll('input[type=checkbox]').forEach(el=>{ el.checked=alle.includes(el.value); });
 sheet.querySelectorAll('[data-ersatz]').forEach(el=>{ el.value=(daten.eigeneErsaetze||{})[el.dataset.ersatz]||''; });
 const weitere=sheet.querySelector('[data-weitere]');
 /* Alte Daten: „Weitere oder genaue Angaben“ war das vierte Textfeld. */
 if(weitere) weitere.value=daten.weitere!=null ? daten.weitere : ((daten.texte||[])[3]||'');
 zeileAnzeigen(sheet);
 const haeufigkeit=sheet.querySelector('.shake-frequency');
 if(haeufigkeit) toggleShakeDetails(haeufigkeit);
}

function renderPersonCards(){
 const wrap=document.getElementById('personCards');
 wrap.innerHTML='';
 wrap.hidden=!openPersons;
 if(!openPersons) return;

 for(let i=1;i<=personCount;i++){
   wrap.insertAdjacentHTML('beforeend',`
   <section class="person-sheet">
     <h2>Person ${i}</h2>

     <label>Name
       <input type="text" class="person-name">
     </label>

     <div class="person-options-grid">
       <label>Altersgruppe
         <select>
           <option value="">Keine Angabe</option>
           <option>Kind</option>
           <option>Jugendliche Person</option>
           <option>Erwachsene Person</option>
         </select>
       </label>

       <label>Ernährungsweise
         <select>
           <option value="">Keine Angabe</option>
           <option>Alles</option>
           <option>Flexitarisch</option>
           <option>Vegetarisch</option>
           <option>Vegan</option>
           <option>Pescetarisch</option>
         </select>
       </label>

       <label>Portionsgröße
         <select>
           <option value="">Keine Angabe</option>
           <option>Klein</option>
           <option>Normal</option>
           <option>Groß</option>
         </select>
       </label>

       <label>Shake-Nutzung
         <select class="shake-frequency" onchange="toggleShakeDetails(this)">
           <option value="none">Keine Shakes</option>
           <option value="occasionally">Gelegentlich</option>
           <option value="regularly">Regelmäßig</option>
         </select>
       </label>

       <label class="shake-details" hidden>Shake einplanen als
         <select>
           <option>Frühstück</option>
           <option>Snack</option>
           <option>Mahlzeitenersatz</option>
         </select>
       </label>
     </div>

     <label>Vorlieben
       <textarea></textarea>
     </label>

     <label>Mag ich nicht
       <textarea></textarea>
     </label>

     <fieldset class="allergy-fieldset">
       <legend>Allergien / Unverträglichkeiten</legend>
       <div class="allergy-options">
         ${ALLERGIEN.map(([wert, text]) => `<label class="allergy-chip"><input type="checkbox" name="person-${i}-allergies" value="${wert}"> ${text}</label>`).join('')}
         <label class="allergy-chip"><input type="checkbox" name="person-${i}-allergies" value="Sonstige"> Sonstige</label>
       </div>

       <div class="own-rows">
         ${ALLERGIEN.map(([wert, text]) => `
         <label class="own-row" data-for="${wert}" hidden>
           <span>${text}: Ich ersetze das durch</span>
           <input type="text" data-ersatz="${wert}" placeholder="z. B. Pinienkerne">
         </label>`).join('')}
       </div>

       <details class="allergy-details">
         <summary>Weitere Unverträglichkeiten</summary>
         <textarea data-weitere placeholder="Alles, was nicht in der Liste steht"></textarea>
       </details>
     </fieldset>
   </section>`);
 }

 /* Für den ganzen Haushalt: Wie groß ist der Airfryer? */
 const af=window.KPAirfryer?KPAirfryer.lade():{personen:2,keiner:false};
 wrap.insertAdjacentHTML('beforeend',`
   <section class="kitchen-sheet" aria-label="Deine Küche">
     <h2>Deine Küche</h2>
     <div class="airfryer-row" id="airfryerRow" ${af.keiner?'hidden':''}>
       <span class="airfryer-text">Mein Airfryer reicht für</span>
       <div class="person-counter small">
         <button class="count-button" type="button" onclick="changeAirfryer(-1)" aria-label="Eine Person weniger">−</button>
         <div class="count-value" id="airfryerCount">${af.personen}</div>
         <button class="count-button" type="button" onclick="changeAirfryer(1)" aria-label="Eine Person mehr">+</button>
       </div>
       <span class="airfryer-text">Personen</span>
     </div>
     <label class="allergy-chip no-airfryer"><input type="checkbox" id="noAirfryer" ${af.keiner?'checked':''} onchange="setNoAirfryer(this.checked)"> Ich habe keinen Airfryer</label>
     <p class="kitchen-hint">Bei Airfryer-Rezepten für mehr Personen zeige ich dir dann die Werte für den Backofen.</p>
   </section>`);

 /* Gespeicherte Angaben wieder eintragen. */
 const gespeichert=ladeDetails();
 wrap.querySelectorAll('.person-sheet').forEach((sheet,idx)=>{ if(gespeichert[idx]) angabenEintragen(sheet, gespeichert[idx]); });

 /* Auf Handy und Tablet als Fenster über der Seite zeigen, mit Schließen-Knopf. */
 const alsFenster=window.matchMedia('(max-width: 1024px)').matches;
 wrap.classList.toggle('as-popup', alsFenster);
 if(alsFenster){
   wrap.insertAdjacentHTML('afterbegin',`<button type="button" class="popup-close" onclick="closePersonPopup()">Schließen</button>`);
   wrap.addEventListener('click',e=>{ if(e.target===wrap) closePersonPopup(); });
 }
}

function changeAirfryer(d){
 if(!window.KPAirfryer) return;
 const n=Math.min(20,Math.max(1,KPAirfryer.lade().personen+d));
 KPAirfryer.speichere({personen:n});
 document.getElementById('airfryerCount').textContent=n;
}

function setNoAirfryer(keiner){
 if(!window.KPAirfryer) return;
 KPAirfryer.speichere({keiner});
 document.getElementById('airfryerRow').hidden=keiner;
}

function closePersonPopup(){
 openPersons=false;
 renderPersonCards();
}
const personenKarten=document.getElementById('personCards');
personenKarten.addEventListener('input', sichereDetails);
personenKarten.addEventListener('change', e=>{
 const sheet=e.target.closest('.person-sheet');
 if(sheet && e.target.matches('input[type=checkbox]')) zeileAnzeigen(sheet);
 sichereDetails();
});
renderPersonCards();
</script>



<script>if (/[?&]test=1/.test(location.search)) document.write('<script src="assets/tests/test-runner.js"><\/script>');</script>
<script>
if (window.KPTest && window.KPTest.enabled) {
  async function urlExists(path) {
    try {
      const r = await fetch(new URL(path, location.href), {cache:"no-store"});
      return {ok:r.ok,status:r.status};
    } catch(e) { return {ok:false,status:0}; }
  }

  function buttonNamed(name) {
    return [...document.querySelectorAll("button")].find(b => b.textContent.includes(name));
  }

  KPTest.add("Zurück-Button vorhanden und klickbar", () => {
    const b=buttonNamed("Zurück"), s=b?getComputedStyle(b):null;
    const ok=!!b && !b.disabled && s.display!=="none" && s.visibility!=="hidden" && s.pointerEvents!=="none";
    return {ok,message:ok?"Button ist sichtbar und nicht blockiert.":"Button fehlt oder ist blockiert."};
  });

  KPTest.add("Zurück-Ziel index.html erreichbar", async () => {
    const b=buttonNamed("Zurück"), code=b?.getAttribute("onclick")||"";
    if(!code.includes("index.html")) return {ok:false,message:"Ziel ist nicht index.html."};
    const r=await urlExists("index.html");
    return {ok:r.ok,message:r.ok?`index.html erreichbar (HTTP ${r.status}).`:`index.html nicht erreichbar${r.status?` (HTTP ${r.status})`:""}.`};
  });

  KPTest.add("Weiter-Button vorhanden und klickbar", () => {
    const b=buttonNamed("Weiter"), s=b?getComputedStyle(b):null;
    const ok=!!b && !b.disabled && s.display!=="none" && s.visibility!=="hidden" && s.pointerEvents!=="none";
    return {ok,message:ok?"Button ist sichtbar und nicht blockiert.":"Button fehlt oder ist blockiert."};
  });

  KPTest.add("Weiter-Ziel grundvorrat.html erreichbar", async () => {
    const b=buttonNamed("Weiter"), code=b?.getAttribute("onclick")||"";
    if(!code.includes("grundvorrat.html")) return {ok:false,message:"Ziel ist nicht grundvorrat.html."};
    const r=await urlExists("grundvorrat.html");
    return {ok:r.ok,message:r.ok?`grundvorrat.html erreichbar (HTTP ${r.status}).`:`grundvorrat.html nicht erreichbar${r.status?` (HTTP ${r.status})`:""}.`};
  });

  KPTest.add("Personenzähler startet bei gespeichertem Wert (sonst 2)", () => {
    const e=document.getElementById("personCount");
    let saved=2; try{saved=Number(JSON.parse(localStorage.getItem("kuechenpilotPersonen")||"2"))||2;}catch(_){}
    return {ok:e?.textContent.trim()===String(saved),message:e?`Aktuell: ${e.textContent.trim()}`:"personCount fehlt."};
  });

  KPTest.add("Plus / Minus funktionieren", () => {
    const c=personCount,o=openPersons;
    changePersons(1); const plus=personCount===c+1;
    changePersons(-1); const minus=personCount===c;
    openPersons=o; renderPersonCards();
    return {ok:plus&&minus,message:plus&&minus?"Plus und Minus reagieren korrekt.":"Zähler reagiert nicht korrekt."};
  });

  KPTest.add("Personenzahl fällt nicht unter 1", () => {
    const c=personCount,o=openPersons;
    personCount=1; document.getElementById("personCount").textContent="1"; changePersons(-1);
    const ok=personCount===1;
    personCount=c; document.getElementById("personCount").textContent=String(c); openPersons=o; renderPersonCards();
    try{localStorage.setItem("kuechenpilotPersonen",JSON.stringify(c));}catch(_){}
    return {ok,message:ok?"Minimum 1 eingehalten.":"Minimum funktioniert nicht."};
  });

  KPTest.add("Optionale Personenkarten öffnen separat", () => {
    const o=openPersons, area=document.getElementById("personCards");
    openPersons=true; renderPersonCards();
    const count=area?.querySelectorAll(".person-sheet").length||0;
    const outside=!!area && !document.querySelector(".welcome-card")?.contains(area);
    const ok=outside && count===personCount;
    openPersons=o; renderPersonCards();
    return {ok,message:ok?`${count} Karte(n) für ${personCount} Person(en).`:"Personenkarten sind nicht korrekt getrennt."};
  });

  KPTest.add("Pilot bleibt beim Öffnen an seiner Position", () => {
    const pilot=matchMedia("(max-width: 760px)").matches?document.querySelector(".pilot-mobile"):document.querySelector(".pilot-desktop");
    if(!pilot) return {ok:false,message:"Pilot nicht gefunden."};
    const o=openPersons;
    openPersons=false; renderPersonCards(); const a=pilot.getBoundingClientRect();
    openPersons=true; renderPersonCards(); const b=pilot.getBoundingClientRect();
    const dx=Math.abs(b.left-a.left),dy=Math.abs(b.top-a.top),ok=dx<2&&dy<2;
    openPersons=o; renderPersonCards();
    return {ok,message:ok?"Pilot bleibt an derselben Position.":`Pilot verschiebt sich um ${dx.toFixed(1)} / ${dy.toFixed(1)} px.`};
  });
}
</script>
