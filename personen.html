<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Küchenpilot - Wer isst mit?</title>
    <style>
        @font-face {
            font-family: "Architects Daughter";
            src: url("fonts/ArchitectsDaughter-Regular.ttf") format("truetype");
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --sand: #fff7ea;
            --card: #fffdf8;
            --orange: #f5a623;
            --orange-dark: #df8f12;
            --text: #333333;
            --muted: #555555;
            --shadow: 0 16px 36px rgba(166, 112, 34, 0.16);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px;
            font-family: "Architects Daughter", sans-serif;
            background: var(--sand);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
        }

        .start-page {
            width: min(100%, clamp(940px, 76vw, 1000px));
            position: relative;
            padding: 48px 110px 48px 0;
        }

        .welcome-card {
            position: relative;
            z-index: 3;
            width: min(100%, clamp(720px, 60vw, 760px));
            background: var(--card);
            border: 2px solid rgba(245, 166, 35, 0.42);
            border-radius: 30px;
            padding: 42px 46px;
            box-shadow: var(--shadow);
        }

        .pilot-card {
            position: absolute;
            z-index: 2;
            right: clamp(105px, 8vw, 118px);
            top: 50%;
            width: clamp(190px, 15vw, 205px);
            max-width: 32vw;
            transform: translateY(-50%);
            pointer-events: none;
            background: var(--card);
            border: 2px solid rgba(245, 166, 35, 0.42);
            border-radius: 28px;
            box-shadow: var(--shadow);
            padding: 6px;
            overflow: hidden;
        }

        .pilot-card img {
            width: 100%;
            height: auto;
            display: block;
        }

        .pilot-mobile {
            display: none;
        }

        h1 {
            margin: 0 0 10px;
            font-size: clamp(2.1rem, 5vw, 3.5rem);
            line-height: 1.08;
            font-weight: 600;
        }

        h1 span {
            color: var(--orange);
        }

        p {
            margin: 0;
            max-width: 560px;
            color: var(--muted);
            font-size: clamp(1.22rem, 2.4vw, 1.55rem);
            line-height: 1.55;
        }

        .button-row {
            margin-top: 34px;
            display: flex;
            justify-content: flex-end;
        }

        .next-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            min-width: 220px;
            min-height: 64px;
            padding: 12px 24px;
            border: 2px solid var(--orange);
            border-radius: 20px;
            background: #ffffff;
            color: var(--orange-dark);
            font-family: inherit;
            font-size: 1.35rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 10px 22px rgba(166, 112, 34, 0.12);
            transition: transform 0.18s ease, box-shadow 0.18s ease, background-color 0.18s ease, color 0.18s ease;
        }

        .next-button:hover,
        .next-button:focus-visible {
            background: var(--orange);
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 14px 28px rgba(166, 112, 34, 0.20);
            outline: none;
        }

        .next-button img {
            width: 34px;
            height: 34px;
            object-fit: contain;
            transition: filter 0.18s ease;
        }

        .next-button:hover img,
        .next-button:focus-visible img {
            filter: brightness(0) invert(1);
        }

        .arrow {
            font-size: 1.45rem;
            line-height: 1;
            transform: translateY(-1px);
        }


        .person-main-row {
            margin-top: 12px;
            display: grid;
            grid-template-columns: minmax(270px, 430px) minmax(220px, 1fr);
            gap: 14px;
            align-items: center;
        }

        .person-count-card {
            background: #fffaf0;
            border: 2px dashed rgba(245, 166, 35, 0.58);
            border-radius: 20px;
            padding: 9px 14px;
        }

        .person-count-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
        }

        .count-button {
            width: 42px;
            height: 42px;
            border: 2px solid var(--orange);
            border-radius: 14px;
            background: #ffffff;
            color: var(--orange-dark);
            font-family: inherit;
            font-size: 1.48rem;
            line-height: 1;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(166, 112, 34, 0.10);
        }

        .count-button:hover,
        .count-button:focus-visible {
            background: var(--orange);
            color: #ffffff;
            outline: none;
        }

        .count-value {
            min-width: 50px;
            text-align: center;
            font-size: clamp(1.82rem, 2.8vw, 2.18rem);
            color: var(--orange-dark);
        }

        .optional-persons {
            margin: 0;
        }

        .optional-persons summary {
            cursor: pointer;
            color: var(--orange-dark);
            font-size: clamp(1.18rem, 2vw, 1.34rem);
            font-weight: 600;
            line-height: 1.22;
            list-style-position: outside;
        }

        .optional-hint {
            margin: 4px 0 0;
            font-size: clamp(1rem, 1.8vw, 1.12rem);
            line-height: 1.25;
            color: var(--muted);
            max-width: 260px;
        }

        .person-list {
            margin-top: 10px;
            display: grid;
            gap: 12px;
            grid-column: 1 / -1;
        }

        .person-card {
            background: #ffffff;
            border: 2px solid rgba(245, 166, 35, 0.30);
            border-radius: 22px;
            padding: 14px;
        }

        .person-card h2 {
            margin: 0 0 8px;
            font-size: 1.24rem;
            color: var(--text);
        }

        label {
            display: block;
            margin-top: 7px;
            font-size: 0.96rem;
            color: var(--muted);
        }

        input,
        textarea {
            width: 100%;
            margin-top: 5px;
            padding: 8px 10px;
            border: 2px solid rgba(245, 166, 35, 0.25);
            border-radius: 14px;
            background: #fffdf8;
            color: var(--text);
            font-family: inherit;
            font-size: 1rem;
        }

        textarea {
            min-height: 46px;
            resize: vertical;
        }

        .button-row-double {
            margin-top: 16px;
            justify-content: space-between;
            gap: 18px;
        }

        .button-row-double .next-button {
            min-width: 185px;
            min-height: 52px;
            font-size: 1.16rem;
        }

        @media (max-width: 760px) {
            body {
                padding: 18px;
                align-items: flex-start;
            }

            .start-page {
                width: 100%;
                padding: 138px 0 0;
                margin-top: 14px;
            }

            .pilot-desktop {
                display: none;
            }

            .pilot-mobile {
                display: block;
            }

            .pilot-card {
                left: 50%;
                right: auto;
                top: 28px;
                width: 225px;
                max-width: 68vw;
                transform: translateX(-50%);
                z-index: 2;
                border-radius: 28px;
                padding: 10px;
            }

            .welcome-card {
                width: 100%;
                z-index: 3;
                padding: 40px 24px 26px;
                border-radius: 26px;
            }

            h1 {
                margin-bottom: 18px;
            }

            .button-row {
                margin-top: 16px;
                justify-content: center;
            }

            .next-button {
                width: 100%;
                max-width: 340px;
                min-height: 62px;
                font-size: 1.28rem;
            }

            .person-main-row {
                margin-top: 30px;
                grid-template-columns: 1fr;
                gap: 18px;
            }

            .person-count-card {
                padding: 18px;
            }

            .person-count-row {
                justify-content: center;
                gap: 28px;
            }

            .optional-hint {
                max-width: none;
            }

            .button-row-double {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 12px;
                justify-content: stretch;
            }

            .button-row-double .next-button {
                width: 100%;
                min-width: 0;
                max-width: none;
                padding: 8px 10px;
                font-size: 1.12rem;
                gap: 8px;
            }
        }

        @media (max-width: 420px) {
            .start-page {
                padding-top: 128px;
            }

            .pilot-card {
                width: 188px;
                top: 30px;
            }

            .welcome-card {
                padding: 40px 20px 24px;
            }
        }
    </style>
</head>
<body>

    <main class="start-page" aria-label="Küchenpilot Personenseite">
        <div class="pilot-card pilot-desktop">
            <img src="assets/figuren/pilot-hinweis-halb.png" alt="Küchenpilot">
        </div>

        <div class="pilot-card pilot-mobile">
            <img src="assets/figuren/pilot-megafreu.png" alt="Küchenpilot">
        </div>

        <section class="welcome-card">
            <h1>Wer <span>isst mit?</span></h1>
            <p>Für wie viele Personen soll der Küchenpilot planen? Weitere Angaben kannst du jederzeit ergänzen.</p>

            <div class="person-main-row">
                <div class="person-count-card" aria-label="Personenanzahl auswählen">
                    <div class="person-count-row">
                        <button class="count-button" type="button" onclick="changePersons(-1)" aria-label="Eine Person weniger">−</button>
                        <div class="count-value" id="personCount">2</div>
                        <button class="count-button" type="button" onclick="changePersons(1)" aria-label="Eine Person mehr">+</button>
                    </div>
                </div>

                <details class="optional-persons">
                    <summary>Optionale Angaben ergänzen</summary>
                    <p class="optional-hint">Hier kannst du Namen, Vorlieben und Allergien hinterlegen.</p>
                    <div class="person-list" id="personList"></div>
                </details>
            </div>

            <div class="button-row button-row-double">
                <button class="next-button" type="button" onclick="location.href='index.html'" aria-label="Zurück zur Startseite">
                    <span class="arrow" aria-hidden="true">←</span>
                    <span>Zurück</span>
                </button>

                <button class="next-button" type="button" onclick="location.href='heute.html'" aria-label="Weiter zur Heute-Seite">
                    <span>Weiter</span>
                    <span class="arrow" aria-hidden="true">→</span>
                </button>
            </div>
        </section>
    </main>

    <script>
        let personCount = 2;

        function changePersons(amount) {
            personCount = Math.max(1, personCount + amount);
            document.getElementById("personCount").textContent = personCount;
            renderPersons();
        }

        function renderPersons() {
            const list = document.getElementById("personList");
            list.innerHTML = "";

            for (let i = 1; i <= personCount; i++) {
                const card = document.createElement("div");
                card.className = "person-card";
                card.innerHTML = `
                    <h2>Person ${i}</h2>

                    <label>Name
                        <input type="text" placeholder="z. B. Manuela">
                    </label>

                    <label>Vorlieben
                        <textarea placeholder="z. B. Kartoffeln, Reis, Fisch"></textarea>
                    </label>

                    <label>Mag ich nicht
                        <textarea placeholder="z. B. Paprika, Linsen"></textarea>
                    </label>

                    <label>Allergien / Unverträglichkeiten
                        <textarea placeholder="z. B. Laktose, Nüsse"></textarea>
                    </label>
                `;
                list.appendChild(card);
            }
        }

        renderPersons();
    </script>

</body>
</html>
