<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Küchenpilot - Rezepte</title>
    <style>
        @font-face {
            font-family: "Architects Daughter";
            src: url("fonts/ArchitectsDaughter-Regular.ttf") format("truetype");
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --sand: #fff7ea;
            --card: #fffdf8;
            --orange: #f5a623;
            --orange-dark: #df8f12;
            --orange-soft: rgba(245, 166, 35, 0.12);
            --line: rgba(245, 166, 35, 0.28);
            --text: #333333;
            --muted: #555555;
            --shadow: 0 16px 36px rgba(166, 112, 34, 0.16);
            --shadow-small: 0 10px 22px rgba(166, 112, 34, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px;
            font-family: "Architects Daughter", sans-serif;
            background: var(--sand);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            color: var(--text);
        }

        .start-page {
            position: relative;
        }

        .welcome-card,
        .pilot-card,
        .sheet {
            background: var(--card);
            border: 2px solid rgba(245, 166, 35, 0.42);
            box-shadow: var(--shadow);
        }

        .welcome-card {
            position: relative;
            z-index: 3;
        }

        .pilot-card {
            position: absolute;
            z-index: 2;
            pointer-events: none;
            border-radius: 28px;
            padding: 6px;
            overflow: hidden;
        }

        .pilot-card img {
            width: 100%;
            height: auto;
            display: block;
        }

        .pilot-mobile {
            display: none;
        }

        h1 {
            margin: 0 0 18px;
            text-align: center;
            line-height: 1.08;
            font-weight: 600;
        }

        h1 span {
            color: var(--orange);
        }

        .welcome-card p {
            margin: 0 auto;
            max-width: 560px;
            text-align: center;
            color: var(--muted);
            line-height: 1.42;
        }

        .button-row {
            margin-top: 22px;
            display: flex;
            justify-content: space-between;
            gap: 18px;
        }

        .next-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-width: 170px;
            min-height: 56px;
            padding: 10px 20px;
            border: 2px solid var(--orange);
            border-radius: 20px;
            background: #ffffff;
            color: var(--orange-dark);
            font-family: inherit;
            font-size: 1.18rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: var(--shadow-small);
            transition: transform 0.18s ease, box-shadow 0.18s ease, background-color 0.18s ease, color 0.18s ease;
        }

        .next-button:hover,
        .next-button:focus-visible {
            background: var(--orange);
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 14px 28px rgba(166, 112, 34, 0.20);
            outline: none;
        }

        .arrow {
            font-size: 1.45rem;
            line-height: 1;
            transform: translateY(-1px);
        }


        /* ---------- Knöpfe „Suchen“ und „Eigenes Rezept“ ---------- */

        .tool-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .tool-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 54px;
            padding: 8px 16px;
            border: 2px solid var(--orange);
            border-radius: 20px;
            background: #ffffff;
            color: var(--orange-dark);
            font-family: "Architects Daughter", sans-serif;
            font-size: 1.18rem;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            box-shadow: var(--shadow-small);
            transition: background-color 0.18s ease, color 0.18s ease, transform 0.18s ease;
        }

        .tool-button:hover,
        .tool-button:focus-visible,
        .tool-button[aria-expanded="true"] {
            background: var(--orange);
            color: #ffffff;
            outline: none;
        }

        .search-sheet {
            position: relative;
        }

        .search-close {
            position: absolute;
            top: 12px;
            right: 14px;
            width: 44px;
            height: 44px;
            border: 0;
            border-radius: 50%;
            background: none;
            color: var(--muted);
            font-size: 1.8rem;
            line-height: 1;
            cursor: pointer;
        }

        .search-close:hover,
        .search-close:focus-visible {
            background: var(--orange-soft);
            color: var(--orange-dark);
            outline: none;
        }

        /* Kleine Überschriften in den Kacheln: Handschrift, kräftig, orange. */
        .sheet-label {
            display: block;
            margin-bottom: 8px;
            color: var(--orange-dark);
            font-family: "Architects Daughter", sans-serif;
            font-size: 1.25rem;
            font-weight: 600;
        }

        /* Airfryer: Hinweis und Backofen-Werte */
        .oven-note {
            margin: 14px 0 0;
            padding: 12px 16px;
            border: 2px dashed var(--orange);
            border-radius: 16px;
            background: var(--orange-soft);
            line-height: 1.45;
        }

        .oven-note strong {
            display: block;
            margin-bottom: 4px;
            color: var(--orange-dark);
        }

        .oven-value {
            color: var(--orange-dark);
            font-style: italic;
        }

        /* ---------- Rezeptbereich ---------- */

        .recipe-area {
            width: min(100%, 922px);
            margin-top: 28px;
            display: grid;
            gap: 22px;
        }

        .sheet {
            border-radius: 26px;
            padding: 26px 28px;
        }

        .sheet h2 {
            margin: 0 0 14px;
            color: var(--orange-dark);
            font-size: 1.5rem;
        }

        .search-field {
            display: block;
        }

        .search-field input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid rgba(245, 166, 35, 0.34);
            border-radius: 16px;
            background: #ffffff;
            color: var(--text);
            font: inherit;
            font-size: 1.15rem;
        }

        .search-field input:focus {
            outline: none;
            border-color: var(--orange);
            box-shadow: 0 0 0 4px var(--orange-soft);
        }

        .filter-group {
            margin-top: 16px;
        }

        .filter-label {
            display: block;
            margin-bottom: 8px;
            font-size: 1.05rem;
            color: var(--muted);
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .cat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(118px, 1fr));
            gap: 10px;
        }

        .cat-tile {
            display: grid;
            gap: 4px;
            padding: 12px 10px;
            border: 2px solid rgba(245, 166, 35, 0.30);
            border-radius: 16px;
            background: #ffffff;
            color: var(--text);
            font: inherit;
            font-family: "Architects Daughter", sans-serif;
            text-align: left;
            cursor: pointer;
            transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
        }

        .cat-tile strong {
            font-size: 1rem;
            overflow-wrap: anywhere;
            font-weight: 600;
        }

        .cat-tile small {
            font-family: "Comfortaa", sans-serif;
            color: var(--muted);
            font-size: 0.92rem;
        }

        .cat-tile:hover,
        .cat-tile:focus-visible {
            border-color: var(--orange);
            outline: none;
        }

        .cat-tile[aria-pressed="true"] {
            background: var(--orange);
            border-color: var(--orange);
            color: #ffffff;
        }

        .cat-tile[aria-pressed="true"] small {
            color: #ffffff;
        }

        .chip {
            padding: 7px 14px;
            border: 2px solid rgba(245, 166, 35, 0.30);
            border-radius: 999px;
            background: #ffffff;
            color: var(--text);
            font: inherit;
            font-size: 1.02rem;
            cursor: pointer;
            transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
        }

        .chip:hover,
        .chip:focus-visible {
            border-color: var(--orange);
            outline: none;
        }

        .chip[aria-pressed="true"] {
            background: var(--orange);
            border-color: var(--orange);
            color: #ffffff;
        }

        .chip small {
            opacity: 0.75;
        }

        .result-line {
            margin: 4px 4px 0;
            color: var(--muted);
            font-size: 1.1rem;
        }

        .recipe-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(255px, 1fr));
            gap: 16px;
        }

        .recipe-card {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 18px 18px 16px;
            border: 2px solid var(--line);
            border-radius: 20px;
            background: var(--card);
            color: inherit;
            text-decoration: none;
            box-shadow: var(--shadow-small);
            transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
        }

        .recipe-card:hover,
        .recipe-card:focus-visible {
            transform: translateY(-3px);
            border-color: var(--orange);
            box-shadow: 0 16px 28px rgba(166, 112, 34, 0.18);
            outline: none;
        }

        .recipe-card .kategorie {
            align-self: flex-start;
            padding: 2px 10px;
            border-radius: 999px;
            background: var(--orange-soft);
            color: var(--orange-dark);
            font-size: 0.95rem;
        }

        .recipe-card h3 {
            margin: 0;
            font-size: 1.22rem;
            line-height: 1.25;
        }

        .facts {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 12px;
            margin-top: auto;
            color: var(--muted);
            font-size: 0.98rem;
        }

        .badge-open {
            color: #b05a00;
        }

        .link-open {
            align-self: flex-start;
            min-height: 50px;
            display: inline-flex;
            align-items: center;
            padding: 10px 20px;
            border: 2px solid var(--orange);
            border-radius: 18px;
            background: var(--orange);
            color: #ffffff;
            font-size: 1.12rem;
            font-weight: 600;
            text-decoration: none;
            box-shadow: var(--shadow-small);
        }

        .link-open:hover,
        .link-open:focus-visible {
            background: var(--orange-dark);
            outline: none;
        }

        .badge-own {
            color: var(--orange-dark);
        }

        .result-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 10px 16px;
        }

        .add-own {
            min-height: 46px;
            padding: 8px 18px;
            border: 2px solid var(--orange);
            border-radius: 16px;
            background: #ffffff;
            color: var(--orange-dark);
            font: inherit;
            font-size: 1.08rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: var(--shadow-small);
        }

        .add-own:hover,
        .add-own:focus-visible {
            background: var(--orange);
            color: #ffffff;
            outline: none;
        }

        .add-own.danger {
            border-color: #d9534f;
            color: #d9534f;
            box-shadow: none;
        }

        .add-own.danger:hover,
        .add-own.danger:focus-visible {
            background: #d9534f;
            color: #ffffff;
        }

        .own-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .confirm-box {
            margin-top: 14px;
            padding: 14px 16px;
            border: 2px dashed #d9534f;
            border-radius: 16px;
            background: #fff5f4;
        }

        .confirm-box p {
            margin: 0 0 12px;
        }

        .empty {
            padding: 28px;
            text-align: center;
            color: var(--muted);
            font-size: 1.15rem;
        }

        /* ---------- Detailansicht ---------- */

        .detail-head {
            text-align: center;
        }

        .detail-head .kategorie {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 999px;
            background: var(--orange-soft);
            color: var(--orange-dark);
            font-size: 1rem;
        }

        .detail-head h2 {
            margin: 12px 0 16px;
            color: var(--text);
            font-size: clamp(1.7rem, 3.6vw, 2.4rem);
            line-height: 1.15;
        }

        .fact-boxes {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        .fact-box {
            min-width: 120px;
            padding: 10px 16px;
            border: 2px solid var(--line);
            border-radius: 16px;
            background: #ffffff;
            text-align: center;
        }

        .fact-box strong {
            display: block;
            font-size: 1.25rem;
        }

        .fact-box span {
            color: var(--muted);
            font-size: 0.95rem;
        }

        .servings {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin: 0 auto 16px;
            padding: 8px 10px;
            border: 2px solid var(--orange);
            border-radius: 999px;
            background: #ffffff;
        }

        .servings button {
            width: 44px;
            height: 44px;
            border: 0;
            border-radius: 50%;
            background: var(--orange);
            color: #ffffff;
            font: inherit;
            font-size: 1.6rem;
            line-height: 1;
            cursor: pointer;
            transition: background-color 0.15s ease, transform 0.15s ease;
        }

        .servings button:hover,
        .servings button:focus-visible {
            background: var(--orange-dark);
            transform: scale(1.06);
            outline: none;
        }

        .servings button:disabled {
            background: #e8dcc8;
            cursor: default;
            transform: none;
        }

        .servings output {
            min-width: 130px;
            text-align: center;
            font-size: 1.3rem;
            font-weight: 600;
        }

        .ersatz-hinweis { display: block; margin-top: 2px; color: #a86a12; font-size: 0.9rem; }
        .wer-isst-mit { margin: 12px 0 4px; }
        .wer-isst-mit summary { cursor: pointer; font-family: 'Architects Daughter', cursive; font-size: 1.1rem; }
        .wer-isst-mit summary span { color: #a86a12; }
        .wer-chip { display: inline-flex; align-items: center; gap: 6px; margin: 4px 10px 4px 0; padding: 6px 10px; border-radius: 999px; border: 1px solid #d8c7a8; }
        .wer-weitere { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
        .wer-weitere input { width: 72px; padding: 6px; border-radius: 8px; border: 1px solid #d8c7a8; }
        .scale-note {
            margin: -4px 0 12px;
            color: var(--muted);
            font-size: 0.98rem;
        }

        .note-open {
            margin: 16px auto 0;
            max-width: 600px;
            padding: 10px 14px;
            border-radius: 14px;
            background: #fff1dc;
            color: #8a4b00;
            text-align: center;
        }

        .detail-columns {
            display: grid;
            grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.3fr);
            gap: 22px;
            align-items: start;
        }

        .ingredients h3 {
            margin: 16px 0 6px;
            font-size: 1.1rem;
            color: var(--muted);
        }

        .ingredients ul {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .ingredients li {
            display: flex;
            gap: 10px;
            padding: 7px 0;
            border-bottom: 1px dashed rgba(245, 166, 35, 0.35);
            font-size: 1.1rem;
        }

        .ingredients li:last-child {
            border-bottom: 0;
        }

        .ingredients .menge {
            flex: 0 0 74px;
            color: var(--orange-dark);
            font-weight: 600;
        }

        .steps ol {
            list-style: none;
            margin: 0;
            padding: 0;
            counter-reset: schritt;
            display: grid;
            gap: 10px;
        }

        .steps li {
            counter-increment: schritt;
            display: grid;
            grid-template-columns: 38px minmax(0, 1fr);
            gap: 12px;
            padding: 12px 14px;
            border: 2px solid var(--line);
            border-radius: 16px;
            background: #ffffff;
            font-size: 1.1rem;
            line-height: 1.45;
            cursor: pointer;
            transition: opacity 0.15s ease, background-color 0.15s ease;
        }

        .steps li::before {
            content: counter(schritt);
            display: grid;
            place-items: center;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: var(--orange);
            color: #ffffff;
            font-weight: 600;
        }

        .steps li.done {
            opacity: 0.5;
            background: #f6f1e8;
        }

        .steps li.done::before {
            content: "✓";
            background: #7cb342;
        }

        .cooked-box {
            margin-top: 18px;
            padding-top: 16px;
            border-top: 2px dashed var(--line);
            display: grid;
            justify-items: center;
            gap: 10px;
            text-align: center;
        }

        .cooked-box > p {
            margin: 0;
            color: var(--muted);
        }

        .cooked-button img {
            width: 30px;
            height: 30px;
            object-fit: contain;
        }

        .shop-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            width: auto;
            max-width: 100%;
            min-height: 40px;
            margin-top: 12px;
            padding: 6px 14px;
            font-size: 0.95rem;
            min-width: 0;
        }
        .shop-button span { line-height: 1.2; }
        .shop-button img {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }

        .cooked-button:disabled {
            opacity: 0.5;
            cursor: default;
            transform: none;
        }

        .cooked-result {
            width: 100%;
            padding: 14px 16px;
            border-radius: 16px;
            background: var(--orange-soft, rgba(245, 166, 35, 0.12));
            text-align: left;
        }

        .cooked-result p {
            margin: 6px 0 0;
            font-size: 1rem;
            line-height: 1.45;
        }

        .cooked-result .link-button {
            margin-top: 8px;
            padding: 0;
            border: 0;
            background: none;
            color: var(--orange-dark);
            font: inherit;
            text-decoration: underline;
            cursor: pointer;
        }

        .cooked-lines {
            margin-top: 6px;
            display: grid;
            gap: 2px;
            color: var(--muted);
        }

        .cooked-line::before {
            content: "• ";
            color: var(--orange-dark);
        }

        .steps .step-amount {
            color: var(--orange-dark);
            font-weight: 700;
        }

        .steps .hint {
            margin: -4px 0 12px;
            color: var(--muted);
            font-size: 0.98rem;
        }

        .tip-box {
            display: grid;
            grid-template-columns: 40px minmax(0, 1fr);
            gap: 12px;
            align-items: start;
            padding: 14px 16px;
            border: 2px dashed rgba(245, 166, 35, 0.55);
            border-radius: 18px;
            background: #fffaf0;
            font-size: 1.08rem;
            line-height: 1.45;
        }

        .tip-box + .tip-box {
            margin-top: 10px;
        }

        .tip-box img {
            width: 36px;
            height: 36px;
            object-fit: contain;
        }

        .tip-box p {
            margin: 0;
        }

        .source {
            margin: 0;
            color: var(--muted);
            font-size: 0.98rem;
        }

        .source a {
            color: var(--orange-dark);
        }

        [hidden] {
            display: none !important;
        }

        @media (min-width: 761px) {
            body.recipes-page .start-page {
                padding-top: clamp(24px, 4vw, 42px);
            }

        }

        @media (max-width: 760px) {
            .pilot-desktop {
                display: none;
            }

            .pilot-mobile {
                display: block;
            }



            .button-row {
                display: grid;
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .button-row .next-button {
                width: 100%;
                min-width: 0;
            }

            .sheet {
                padding: 22px 18px;
            }

            .detail-columns {
                grid-template-columns: 1fr;
            }

            .recipe-grid {
                grid-template-columns: 1fr;
            }

            .add-own {
                width: 100%;
            }
        }
    </style>
    <link rel="stylesheet" href="assets/styles/responsive-master.css?v=6">
    <link rel="stylesheet" href="assets/tests/test-ui.css">
</head>
<body class="recipes-page no-next">

    <main class="start-page" aria-label="Küchenpilot Rezepte">
        <div class="hero-shell">
            <div class="pilot-card pilot-desktop">
                <img src="assets/figuren/pilot-rezept.png" alt="Küchenpilot mit Rezeptbuch">
            </div>

            <div class="pilot-card pilot-mobile">
                <img src="assets/figuren/pilot-rezept.png" alt="Küchenpilot mit Rezeptbuch">
            </div>

            <section class="welcome-card">
                <div class="card-main">
                    <h1>Deine <span>Rezepte.</span></h1>
                    <p id="introText">Entdecken, kochen, speichern, lieben. Such dir etwas Leckeres aus – ich führe dich Schritt für Schritt hindurch.</p>
                </div>

                <div class="button-row">
                    <button class="next-button" type="button" id="backButton" aria-label="Zurück">
                        <span class="arrow" aria-hidden="true">←</span>
                        <span id="backLabel">Zurück</span>
                    </button>
                </div>
            </section>
        </div>

        <div class="recipe-area" id="overview">
            <div class="tool-row">
                <button class="tool-button" type="button" id="searchToggle" aria-expanded="false" aria-controls="searchSheet">
                    <span aria-hidden="true">🔍</span> Suchen
                </button>
                <button class="tool-button" type="button" id="addOwn" onclick="location.href='rezept-bearbeiten.html'">+ Eigenes Rezept</button>
            </div>

            <section class="sheet search-sheet" id="searchSheet" aria-label="Rezepte suchen und filtern" hidden>
                <button class="search-close" type="button" id="searchClose" aria-label="Suche schließen">×</button>
                <label class="search-field">
                    <span class="sheet-label">Rezept oder Zutat</span>
                    <input id="search" type="search" autocomplete="off" placeholder="z. B. Hähnchen, Kartoffeln, Kuchen …">
                </label>

                <div class="filter-group">
                    <span class="sheet-label">Zubereitung</span>
                    <div class="chips" id="deviceChips"></div>
                </div>
            </section>

            <section class="sheet" aria-label="Kategorien">
                <h2>Kategorien</h2>
                <div class="cat-grid" id="categoryTiles"></div>
            </section>

            <p class="result-line" id="resultLine" aria-live="polite"></p>
            <div class="recipe-grid" id="recipeGrid"></div>
        </div>

        <div class="recipe-area" id="detail" hidden></div>
    </main>

    <script src="assets/scripts/portionen.js?v=2"></script>
    <script src="data/rezepte.js"></script>
    <script src="assets/scripts/eigene-rezepte.js?v=1"></script>
    <script src="assets/scripts/ersatz.js?v=2"></script>
    <script src="assets/scripts/airfryer.js?v=1"></script>
    <script src="assets/scripts/planer.js?v=5"></script>
    <script>
        const DATA = window.KP_REZEPTE || { rezepte: [] };
        const RECIPES = DATA.rezepte;
        const ALL = 'Alle';

        const state = { query: '', category: ALL, device: ALL };

        const els = {
            overview: document.getElementById('overview'),
            detail: document.getElementById('detail'),
            search: document.getElementById('search'),
            categoryTiles: document.getElementById('categoryTiles'),
            deviceChips: document.getElementById('deviceChips'),
            resultLine: document.getElementById('resultLine'),
            grid: document.getElementById('recipeGrid'),
            backButton: document.getElementById('backButton'),
            backLabel: document.getElementById('backLabel'),
            intro: document.getElementById('introText')
        };

        const introDefault = els.intro.textContent;

        function esc(value) {
            return String(value ?? '')
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');
        }

        function normalize(text) {
            return String(text || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replaceAll('ß', 'ss');
        }

        function countBy(list) {
            const map = new Map();
            list.forEach(item => map.set(item, (map.get(item) || 0) + 1));
            return [...map.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'de'));
        }

        function portionText(r) {
            const anzahl = KPPortionen.standard(r);
            return anzahl ? KPPortionen.beschriftung(r, anzahl) : '';
        }

        const searchIndex = new Map(RECIPES.map(r => [r.id, normalize([
            r.titel, r.kategorie, ...(r.tags || []), ...(r.geraete || []),
            ...(r.zutaten || []).map(z => z.name || z.text)
        ].join(' '))]));

        /* ---------- Übersicht ---------- */

        /* Kategorien als kleine Kacheln oben; "Alle" zeigt wieder alles. */
        function renderTiles(container, entries, key) {
            const all = [[ALL, RECIPES.length], ...entries];
            container.innerHTML = all.map(([name, count]) => `
                <button type="button" class="cat-tile" data-value="${esc(name)}" aria-pressed="${state[key] === name}">
                    <strong>${esc(name)}</strong> <small>${count} ${count === 1 ? 'Rezept' : 'Rezepte'}</small>
                </button>`).join('');
            container.querySelectorAll('.cat-tile').forEach(tile => {
                tile.addEventListener('click', () => {
                    state[key] = tile.dataset.value;
                    container.querySelectorAll('.cat-tile').forEach(c => c.setAttribute('aria-pressed', c === tile));
                    renderList();
                });
            });
        }

        function renderChips(container, entries, key) {
            const all = [[ALL, RECIPES.length], ...entries];
            container.innerHTML = all.map(([name, count]) => `
                <button type="button" class="chip" data-value="${esc(name)}" aria-pressed="${state[key] === name}">
                    ${esc(name)} <small>${count}</small>
                </button>`).join('');
            container.querySelectorAll('.chip').forEach(chip => {
                chip.addEventListener('click', () => {
                    state[key] = chip.dataset.value;
                    container.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c === chip));
                    renderList();
                });
            });
        }

        function filtered() {
            const words = normalize(state.query).split(/\s+/).filter(Boolean);
            return RECIPES.filter(r => {
                if (state.category !== ALL && r.kategorie !== state.category) return false;
                if (state.device !== ALL && !(r.geraete || []).includes(state.device)) return false;
                const hay = searchIndex.get(r.id);
                return words.every(w => hay.includes(w));
            });
        }

        function cardHtml(r) {
            const facts = [
                r.geraete && r.geraete.length ? r.geraete.join(', ') : '',
                portionText(r),
                r.zeitMin ? `ca. ${r.zeitMin} Min.` : '',
                r.naehrwerte && r.naehrwerte.kcal ? `${r.naehrwerte.kcal} kcal` : ''
            ].filter(Boolean);
            const open = r.status === 'unvollständig' ? '<span class="badge-open">noch unvollständig</span>'
                : r.linkOnly ? '<span class="badge-own">nur Link</span>'
                : r.eigen ? '<span class="badge-own">eigenes Rezept</span>' : '';
            return `
                <a class="recipe-card" href="#rezept/${encodeURIComponent(r.id)}">
                    <span class="kategorie">${esc(r.kategorie)}</span>
                    <h3>${esc(r.titel)}</h3>
                    <div class="facts">${facts.map(f => `<span>${esc(f)}</span>`).join('<span aria-hidden="true">·</span>')}${open}</div>
                </a>`;
        }

        function renderList() {
            const list = filtered();
            els.resultLine.textContent = list.length === RECIPES.length
                ? `${list.length} Rezepte in deiner Sammlung`
                : `${list.length} von ${RECIPES.length} Rezepten`;
            els.grid.innerHTML = list.length
                ? list.map(cardHtml).join('')
                : '<div class="sheet empty">Dazu habe ich leider nichts gefunden. Versuch es mit einem anderen Wort oder setz die Filter zurück.</div>';
        }

        /* ---------- Detail ---------- */

        let current = null;

        function ingredientsHtml(r) {
            const groups = [];
            (r.zutaten || []).forEach(z => {
                const name = z.gruppe || '';
                let group = groups.find(g => g.name === name);
                if (!group) groups.push(group = { name, items: [] });
                group.items.push(z);
            });
            return groups.map(g => `
                ${g.name ? `<h3>${esc(g.name)}</h3>` : ''}
                <ul>
                    ${g.items.map(z => {
                        const amount = [z.menge, z.einheit].filter(Boolean).join(' ');
                        const name = amount ? z.name : (z.name || z.text);
                        const ersatz = window.KPErsatz && current ? KPErsatz.fuerZutat(z, KPErsatz.gewaehlte(current.recipe.id)) : [];
                        const hinweis = ersatz.map(e => `${e.personen.join(', ')}: ${e.vorschlaege.join(' oder ')}`).join(' · ');
                        return `<li><span class="menge">${esc(amount)}</span><span>${esc(name)}${hinweis ? `<small class="ersatz-hinweis">Ersatz für ${esc(hinweis)}</small>` : ''}</span></li>`;
                    }).join('')}
                </ul>`).join('');
        }

        function renderDetail(r, wunsch) {
            const n = r.naehrwerte || {};
            const standard = KPPortionen.standard(r);
            const personenRezept = KPPortionen.basis(r).personen;
            /* „Wer isst mit?“: Standard ist die eingestellte Personenzahl, nicht ein fester Wert. */
            const wer = KPErsatz.werIsstMit(r.id);
            const werZahl = Math.min(20, Math.max(1, wer.ids.length + wer.weitere));
            /* Personenzahl kann von der Heute-Seite mitkommen: #rezept/<id>/<anzahl> */
            const anzahl = standard && wunsch ? Math.min(20, Math.max(1, wunsch))
                : (standard && personenRezept ? werZahl : standard);
            current = { recipe: r, anzahl };
            const werHtml = personenRezept ? `
                    <details class="wer-isst-mit" id="werIsstMit">
                        <summary>Wer isst mit? <span>${werZahl} ${werZahl === 1 ? 'Person' : 'Personen'}</span></summary>
                        ${KPErsatz.personen().length
                            ? KPErsatz.personen().map(p => `<label class="wer-chip"><input type="checkbox" data-person="${p.index}" ${wer.ids.includes(p.index) ? 'checked' : ''}> ${esc(p.name)}</label>`).join('')
                            : '<p class="hint">Noch keine Personen angelegt. <a href="personen.html">Personen eintragen</a></p>'}
                        <label class="wer-weitere">Weitere Personen ohne Namen
                            <input type="number" id="werWeitere" min="0" max="50" value="${wer.weitere}">
                        </label>
                    </details>` : '';
            const boxes = [
                r.zeitMin ? [`ca. ${r.zeitMin}`, 'Minuten'] : null,
                n.kcal ? [n.kcal, 'kcal pro Portion'] : null,
                n.eiweiss != null ? [`${n.eiweiss} g`, 'Eiweiß'] : null,
                n.kohlenhydrate != null ? [`${n.kohlenhydrate} g`, 'Kohlenhydrate'] : null,
                n.fett != null ? [`${n.fett} g`, 'Fett'] : null,
                r.geraete && r.geraete.length ? [r.geraete.join(' / '), 'Zubereitung'] : null
            ].filter(Boolean);

            const tips = [...(r.tipps || []).map(t => ['gluehbirne', t.replace(/^Tipp:\s*/, '')]), ...(r.notizen || []).map(t => ['klemmbrett', t])];
            const quelle = r.quelle || {};

            els.detail.innerHTML = `
                <section class="sheet detail-head">
                    <span class="kategorie">${esc(r.kategorie)}</span>
                    <h2>${esc(r.titel)}</h2>
                    ${quelle.art ? `<p class="source source-top">Quelle: ${quelle.url ? `<a href="${esc(quelle.url)}" target="_blank" rel="noopener">${esc(quelle.art)}</a>` : esc(quelle.art)}</p>` : ''}
                    ${anzahl ? `
                    <div class="servings" role="group" aria-label="Personen anpassen">
                        <button type="button" id="servingsLess" aria-label="Weniger">−</button>
                        <output id="servingsValue" aria-live="polite"></output>
                        <button type="button" id="servingsMore" aria-label="Mehr">+</button>
                    </div>` : ''}
                    ${anzahl ? werHtml : ''}
                    <div class="oven-note" id="ovenNote" role="status" hidden></div>
                    <div class="fact-boxes">
                        ${boxes.map(([value, label]) => `<div class="fact-box"><strong>${esc(value)}</strong><span>${esc(label)}</span></div>`).join('')}
                    </div>
                    ${r.status === 'unvollständig' ? '<p class="note-open">Dieses Rezept ist noch unvollständig – Angaben können fehlen.</p>' : ''}
                </section>

                <div class="detail-columns">
                    <section class="sheet ingredients">
                        <h2>Zutaten</h2>
                        <p class="scale-note" id="scaleNote" hidden></p>
                        <div id="ingredientList"></div>
                        <button class="next-button shop-button" type="button" id="shopButton">
                            <img src="assets/icons/kiste.png" alt="" aria-hidden="true">
                            <span>Auf die Einkaufsliste</span>
                        </button>
                        <p class="hint" id="shopMessage" role="status" hidden></p>
                    </section>

                    <section class="sheet steps">
                        <h2>Zubereitung</h2>
                        <p class="hint">Tipp auf einen Schritt, um ihn abzuhaken.</p>
                        <ol id="stepList">${(r.schritte || []).map(s => `<li><span>${esc(s)}</span></li>`).join('')}</ol>
                        <div class="cooked-box">
                            <p>Fertig gekocht? Dann ziehe ich die Zutaten von deinem Vorrat ab.</p>
                            <button class="next-button cooked-button" type="button" id="cookedButton">
                                <img src="assets/icons/topf.png" alt="" aria-hidden="true">
                                <span>Gekocht</span>
                            </button>
                            <div id="cookedResult" role="status"></div>
                        </div>
                    </section>
                </div>

                ${tips.length ? `
                <section class="sheet">
                    <h2>Tipps vom Küchenpilot</h2>
                    ${tips.map(([icon, text]) => `<div class="tip-box"><img src="assets/icons/${icon}.png" alt=""><p>${esc(text)}</p></div>`).join('')}
                </section>` : ''}


                ${r.eigen ? `
                <section class="sheet own-actions" aria-label="Eigenes Rezept">
                    <h2>Dein eigenes Rezept</h2>
                    <div class="own-buttons">
                        <button class="add-own" type="button" id="editOwn">Bearbeiten</button>
                        <button class="add-own danger" type="button" id="deleteOwn">Löschen</button>
                    </div>
                    <div class="confirm-box" id="deleteConfirm" hidden>
                        <p>„${esc(r.titel)}“ wirklich löschen? Das geht nicht rückgängig.</p>
                        <div class="own-buttons">
                            <button class="add-own danger" type="button" id="deleteYes">Ja, löschen</button>
                            <button class="add-own" type="button" id="deleteNo">Abbrechen</button>
                        </div>
                    </div>
                </section>` : ''}
            `;

            if (r.eigen) {
                document.getElementById('editOwn').addEventListener('click', () => {
                    location.href = `rezept-bearbeiten.html?id=${encodeURIComponent(r.id)}`;
                });
                document.getElementById('deleteOwn').addEventListener('click', () => {
                    document.getElementById('deleteConfirm').hidden = false;
                });
                document.getElementById('deleteNo').addEventListener('click', () => {
                    document.getElementById('deleteConfirm').hidden = true;
                });
                document.getElementById('deleteYes').addEventListener('click', () => {
                    KPEigeneRezepte.remove(r.id);
                    location.replace('rezepte.html');
                });
            }

            els.detail.querySelectorAll('.steps li').forEach(li => {
                li.addEventListener('click', () => li.classList.toggle('done'));
            });

            document.getElementById('cookedButton').addEventListener('click', markCooked);

            if (anzahl) {
                document.getElementById('servingsLess').addEventListener('click', () => setServings(current.anzahl - 1));
                document.getElementById('servingsMore').addEventListener('click', () => setServings(current.anzahl + 1));
            }

            /* „Wer isst mit?“: Auswahl speichern und Zahl sofort übernehmen. */
            const werBox = document.getElementById('werIsstMit');
            if (werBox) {
                werBox.addEventListener('change', () => {
                    const ids = [...werBox.querySelectorAll('input[data-person]:checked')].map(el => Number(el.dataset.person));
                    const weitere = Math.max(0, Number(document.getElementById('werWeitere').value) || 0);
                    KPErsatz.werIsstMitSpeichern(r.id, { ids, weitere });
                    werBox.querySelector('summary span').textContent = `${Math.max(1, ids.length + weitere)} ${ids.length + weitere === 1 ? 'Person' : 'Personen'}`;
                    setServings(Math.max(1, ids.length + weitere));
                });
            }
            setServings(anzahl);
        }

        /* Zutaten für die gewählte Anzahl umrechnen (Funktionen in assets/scripts/portionen.js). */
        function setServings(anzahl) {
            const r = current.recipe;
            const original = KPPortionen.basis(r).anzahl;
            if (original) {
                anzahl = Math.min(20, Math.max(1, anzahl));
                current.anzahl = anzahl;
                document.getElementById('servingsValue').textContent = KPPortionen.beschriftung(r, anzahl);
                document.getElementById('servingsLess').disabled = anzahl <= 1;
                document.getElementById('servingsMore').disabled = anzahl >= 20;
            }
            const scaled = original ? KPPortionen.skaliereRezept(r, anzahl) : r;
            document.getElementById('ingredientList').innerHTML = ingredientsHtml(scaled);

            /* Mengen in den Schritten ebenfalls umrechnen; abgehakte Schritte bleiben abgehakt. */
            const f = original ? KPPortionen.faktor(r, anzahl) : 1;
            document.querySelectorAll('#stepList li').forEach((li, i) => {
                li.querySelector('span').innerHTML = KPPortionen.skaliereText(esc((r.schritte || [])[i] || ''), f,
                    neu => `<strong class="step-amount">${neu}</strong>`);
            });

            /* Airfryer-Rezepte: ab mehr Personen, als in den eigenen Airfryer passen, Backofen-Werte zeigen. */
            const ofen = window.KPAirfryer && KPAirfryer.brauchtOfen(r, current.anzahl || KPPortionen.basis(r).anzahl);
            if (ofen) {
                document.querySelectorAll('#stepList li span').forEach(span => {
                    span.innerHTML = KPAirfryer.mitOfenWerten(span.innerHTML);
                });
            }
            const ovenNote = document.getElementById('ovenNote');
            ovenNote.hidden = !ofen;
            if (ofen) {
                const keiner = KPAirfryer.lade().keiner;
                ovenNote.innerHTML = keiner
                    ? '<strong>Ohne Airfryer? Kein Problem.</strong>Die Backofen-Werte stehen in Klammern bei den Schritten (Ober-/Unterhitze, vorgeheizt). Es sind Richtwerte, schau lieber etwas früher nach.'
                    : `<strong>Für mehr als ${KPAirfryer.lade().personen === 2 ? 'zwei' : KPAirfryer.lade().personen} Personen passt das je nach Größe deines Airfryers vermutlich nicht mehr hinein. Dann nimm lieber den Backofen.</strong>Die Backofen-Werte stehen in Klammern bei den Schritten (Ober-/Unterhitze, vorgeheizt). Es sind Richtwerte, schau lieber etwas früher nach.`;
            }

            const note = document.getElementById('scaleNote');
            note.hidden = !original || anzahl === original;
            note.textContent = `Umgerechnet vom Originalrezept für ${KPPortionen.beschriftung(r, original)}. Auch die Mengen in der Zubereitung sind angepasst.`;
        }

        /* ---------- Gekocht: Vorrat abziehen ---------- */

        let cookedUndo = null;

        function markCooked() {
            const P = window.KPPlaner;
            const box = document.getElementById('cookedResult');
            if (!P) return;
            const r = current.recipe;
            const f = KPPortionen.basis(r).anzahl ? KPPortionen.faktor(r, current.anzahl) : 1;
            cookedUndo = P.snapshot();
            const changes = P.removeFromStock(r, f);
            const day = P.markCooked(r.id);
            const hasStock = !!P.getStockDetails();
            const lines = changes.map(c => `<span class="cooked-line">${esc(c.name)} – ${esc(c.text)}</span>`).join('');
            box.innerHTML = `
                <div class="cooked-result">
                    <strong>Guten Appetit! 😋</strong>
                    ${changes.length
                        ? `<p>Aus dem Vorrat abgezogen:</p><div class="cooked-lines">${lines}</div>`
                        : `<p>${hasStock ? 'Für dieses Rezept stand nichts mit Menge im Vorrat – da gab es nichts abzuziehen.' : 'Du hast noch keinen Vorrat gespeichert.'}</p>`}
                    ${day ? '<p>Im Wochenkorb als gekocht markiert.</p>' : ''}
                    <button class="link-button" type="button" id="cookedUndo">Rückgängig</button>
                </div>`;
            document.getElementById('cookedButton').disabled = true;
            document.getElementById('cookedUndo').addEventListener('click', () => {
                P.restore(cookedUndo);
                cookedUndo = null;
                box.innerHTML = '';
                document.getElementById('cookedButton').disabled = false;
            });
        }

        /* Nur-Link-Rezepte: kein Rezepttext, nur Name, Quelle, Notiz. */
        function renderLinkOnly(r) {
            const quelle = r.quelle || {};
            els.detail.innerHTML = `
                <section class="sheet detail-head">
                    <span class="kategorie">${esc(r.kategorie)}</span>
                    <h2>${esc(r.titel)}</h2>
                    ${quelle.url ? `<p class="source">Quelle: <a href="${esc(quelle.url)}" target="_blank" rel="noopener">${esc(quelle.art || quelle.url)}</a></p>` : ''}
                </section>
                ${quelle.url ? `<a class="link-open" href="${esc(quelle.url)}" target="_blank" rel="noopener">Rezept auf der Seite öffnen</a>` : ''}
                ${r.notizen && r.notizen.length ? `<section class="sheet"><h2>Meine Notiz</h2>${r.notizen.map(n => `<p>${esc(n)}</p>`).join('')}</section>` : ''}
                <section class="sheet own-actions" aria-label="Eigener Eintrag">
                    <div class="own-buttons">
                        <button class="add-own" type="button" id="editOwn">Bearbeiten</button>
                        <button class="add-own danger" type="button" id="deleteOwn">Löschen</button>
                    </div>
                    <div class="confirm-box" id="deleteConfirm" hidden>
                        <p>„${esc(r.titel)}“ wirklich löschen? Das geht nicht rückgängig.</p>
                        <div class="own-buttons">
                            <button class="add-own danger" type="button" id="deleteYes">Ja, löschen</button>
                            <button class="add-own" type="button" id="deleteNo">Abbrechen</button>
                        </div>
                    </div>
                </section>`;
            document.getElementById('editOwn').addEventListener('click', () => {
                location.href = `rezept-bearbeiten.html?id=${encodeURIComponent(r.id)}`;
            });
            document.getElementById('deleteOwn').addEventListener('click', () => {
                document.getElementById('deleteConfirm').hidden = false;
            });
            document.getElementById('deleteNo').addEventListener('click', () => {
                document.getElementById('deleteConfirm').hidden = true;
            });
            document.getElementById('deleteYes').addEventListener('click', () => {
                KPEigeneRezepte.remove(r.id);
                location.replace('rezepte.html');
            });
        }

        /* ---------- Navigation ---------- */

        function route() {
            const match = location.hash.match(/^#rezept\/([^/]+)(?:\/(\d+))?$/);
            const recipe = match && RECIPES.find(r => r.id === decodeURIComponent(match[1]));

            if (recipe && recipe.linkOnly) {
                renderLinkOnly(recipe);
                els.overview.hidden = true;
                els.detail.hidden = false;
                els.backLabel.textContent = 'Zurück zur Übersicht';
                els.intro.textContent = 'Das Rezept steht auf der Quellseite. Hier hast du deine Notiz und den Link.';
                document.title = `Küchenpilot - ${recipe.titel}`;
            } else if (recipe) {
                renderDetail(recipe, match[2] ? Number(match[2]) : 0);
                els.overview.hidden = true;
                els.detail.hidden = false;
                els.backLabel.textContent = 'Zurück zur Übersicht';
                els.intro.textContent = 'Alles bereit? Dann lass uns loslegen – Schritt für Schritt.';
                document.title = `Küchenpilot - ${recipe.titel}`;
            } else {
                els.detail.hidden = true;
                els.overview.hidden = false;
                els.backLabel.textContent = 'Zurück';
                els.intro.textContent = introDefault;
                document.title = 'Küchenpilot - Rezepte';
            }
            window.scrollTo(0, 0);
        }

        els.backButton.addEventListener('click', () => {
            if (location.hash.startsWith('#rezept/')) {
                location.hash = '';
            } else {
                location.href = 'index.html';
            }
        });

        els.search.addEventListener('input', () => {
            state.query = els.search.value;
            renderList();
        });

        /* Suche erst nach Tipp auf „Suchen“ zeigen. Solange sie offen ist, wird in allen
           Kategorien gesucht und die Kategorie-Kachel ausgeblendet, damit die Treffer
           am Handy direkt unter dem Suchfeld stehen. */
        const searchToggle = document.getElementById('searchToggle');
        const searchSheet = document.getElementById('searchSheet');
        const categorySheet = els.categoryTiles.closest('.sheet');

        function setSearchOpen(open) {
            searchSheet.hidden = !open;
            categorySheet.hidden = open;
            searchToggle.setAttribute('aria-expanded', String(open));
            state.query = '';
            state.device = ALL;
            state.category = ALL;
            els.search.value = '';
            renderTiles(els.categoryTiles, countBy(RECIPES.map(r => r.kategorie)), 'category');
            renderChips(els.deviceChips, countBy(RECIPES.flatMap(r => r.geraete || [])), 'device');
            renderList();
            if (open) els.search.focus();
        }

        searchToggle.addEventListener('click', () => setSearchOpen(searchSheet.hidden));
        document.getElementById('searchClose').addEventListener('click', () => {
            setSearchOpen(false);
            searchToggle.focus();
        });

        renderTiles(els.categoryTiles, countBy(RECIPES.map(r => r.kategorie)), 'category');
        renderChips(els.deviceChips, countBy(RECIPES.flatMap(r => r.geraete || [])), 'device');
        renderList();
        window.addEventListener('hashchange', route);
        route();
    </script>

    <script>
    /* Zutaten dieses Rezepts direkt auf die Einkaufsliste der aktuellen Woche setzen. */
    document.addEventListener('click', e => {
        const knopf = e.target.closest('#shopButton');
        if (!knopf || !current || !current.recipe) return;
        const r = current.recipe;
        const sc = current.anzahl ? KPPortionen.skaliereRezept(r, current.anzahl) : r;
        const woche = KPPlaner.currentWeek();
        const st = KPPlaner.getShopState(woche);
        let neu = 0;
        (sc.zutaten || []).forEach(z => {
            const menge = [z.menge, z.einheit].filter(Boolean).join(' ');
            const text = (menge ? `${menge} ${z.name || z.text}` : (z.name || z.text)).trim();
            if (text && !st.eigene.includes(text)) { st.eigene.push(text); neu++; }
        });
        KPPlaner.saveShopState(woche, st);
        const meldung = document.getElementById('shopMessage');
        meldung.hidden = false;
        meldung.textContent = neu ? `${neu} Zutaten stehen jetzt auf der Einkaufsliste.` : 'Diese Zutaten stehen schon auf der Einkaufsliste.';
    });
    </script>
    <script>if (/[?&]test=1/.test(location.search)) document.write('<script src="assets/tests/test-runner.js"><\/script>');</script>
    <script>
        if (window.KPTest && window.KPTest.enabled) {
            KPTest.add('Rezeptdaten geladen', () => {
                const n = (window.KP_REZEPTE && window.KP_REZEPTE.rezepte || []).length;
                return { ok: n > 0, message: `${n} Rezepte gefunden` };
            });
            KPTest.add('Alle Rezepte in der Übersicht', () => {
                const cards = document.querySelectorAll('#recipeGrid .recipe-card').length;
                const ok = location.hash || cards === RECIPES.length;
                return { ok: !!ok, message: `${cards} Karten angezeigt` };
            });
            KPTest.add('Rezept-IDs eindeutig', () => {
                const ids = RECIPES.map(r => r.id);
                const dupes = ids.filter((id, i) => ids.indexOf(id) !== i);
                return { ok: !dupes.length, message: dupes.length ? `Doppelt: ${dupes.join(', ')}` : 'Alle IDs eindeutig' };
            });
            KPTest.add('Umrechnung auf 2 Personen', () => {
                const r = RECIPES.find(x => x.id === 'butter-chicken');
                if (!r) return { ok: true, message: 'Testrezept nicht vorhanden' };
                const z = KPPortionen.skaliereRezept(r, 2).zutaten[0];
                return { ok: z.menge === '300', message: z.text };
            });
            KPTest.add('Mengen in der Zubereitung umgerechnet', () => {
                const t = KPPortionen.skaliereText('100 ml Brühe, 1–2 EL Milch, ½ TL Salz, 5 Minuten bei 180 °C, 4 mm dick', 0.5);
                const soll = '50 ml Brühe, ½–1 EL Milch, ¼ TL Salz, 5 Minuten bei 180 °C, 4 mm dick';
                return { ok: t === soll, message: t };
            });
            KPTest.add('Jedes Rezept hat Zutaten und Schritte', () => {
                const bad = RECIPES.filter(r => !(r.zutaten || []).length || !(r.schritte || []).length).map(r => r.titel);
                return { ok: !bad.length, message: bad.length ? bad.join(', ') : 'Alle vollständig' };
            });
        }
    </script>
    <script src="assets/scripts/menue.js?v=1"></script>
</body>
